name: Dépendances

on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:
  # A new dependency is checked on its pull request, not the next Monday.
  pull_request:
    paths: [Cargo.lock, pnpm-lock.yaml, deny.toml]

# Read-only by default, whatever the repository setting says.
permissions:
  contents: read

jobs:
  audit:
    name: Licences et failles
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny
      # Called directly: a pnpm script would install everything first.
      - run: cargo deny check advisories licenses
      - run: pnpm audit
