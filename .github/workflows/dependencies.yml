name: Dépendances

on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:
  # A new dependency is checked on its pull request, not the next Monday.
  pull_request:
    paths: [Cargo.lock, pnpm-lock.yaml, deny.toml]

jobs:
  audit:
    name: Licences et failles
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Called directly: a pnpm script would install everything first.
      - run: cargo deny check advisories licenses
      - run: pnpm audit
