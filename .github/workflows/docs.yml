name: Documentation

# Read again when a label is added or removed (« sans-doc » lifts the check), and when the base
# branch changes.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

jobs:
  docs:
    name: Documentation à jour
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: node scripts/check-docs-touched.mjs
