name: Documentation

# Read again when a label is added or removed (« sans-doc » lifts the check), and when the base
# branch changes.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

# Read-only by default, whatever the repository setting says.
permissions:
  contents: read

jobs:
  docs:
    name: Documentation à jour
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: node scripts/check-docs-touched.mjs
