name: Mutants

# Long: launched by hand from the Actions tab, or locally with `pnpm mutants:domain`.
on:
  workflow_dispatch:

# Read-only by default, whatever the repository setting says.
permissions:
  contents: read

jobs:
  mutants:
    name: Mutants du domaine
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-mutants
      - run: cargo mutants -p domain
