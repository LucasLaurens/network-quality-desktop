name: Release

# Each push to main updates the release pull request; merging it tags the version, writes the
# changelog, publishes the GitHub release and builds the three installers below.
on:
  push:
    branches: [main]

# One run at a time, never cancelled: a run may be building installers.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  # release-please bumps Cargo.toml; Cargo.lock lists the workspace's crates with their version too.
  lockfile:
    name: Cargo.lock de la release
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      - run: cargo update --workspace
      - name: Commit Cargo.lock
        run: |
          git diff --quiet -- Cargo.lock && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync Cargo.lock with the release version' -- Cargo.lock
          git push

  installers:
    name: Installeurs (${{ matrix.os }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Uploads the installers to the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-dependencies

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile

      # Unsigned, for personal use: macOS and Windows warn on first launch.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.release-please.outputs.tag_name }}
