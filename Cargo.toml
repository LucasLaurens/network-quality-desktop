[workspace]
members = ["crates/domain", "crates/application", "crates/infrastructure", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[workspace.dependencies]
domain = { path = "crates/domain" }
application = { path = "crates/application" }
infrastructure = { path = "crates/infrastructure" }
fluent-bundle = "0.16"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ping-async = "=1.0.2"
serde = { version = "1.0.229", features = ["derive"] }
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
tauri = "~2.12.4"
tauri-build = "~2.7.3"
tauri-plugin-positioner = { version = "=2.4.0", features = ["tray-icon"] }
tauri-plugin-opener = "=2.5.5"
netdev = "=0.46.3"
# Already linked by tao on Linux: reusing it adds no native dependency.
dbus = "=0.9.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
unic-langid = { version = "0.9", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
