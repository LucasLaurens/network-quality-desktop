[workspace]
members = ["crates/domain", "crates/application", "crates/infrastructure", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[workspace.dependencies]
domain = { path = "crates/domain" }
application = { path = "crates/application" }
infrastructure = { path = "crates/infrastructure" }
fluent-bundle = "0.16"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ping-async = "=1.0.2"
serde = { version = "1.0.229", features = ["derive"] }
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
tauri = "~2.12.4"
tauri-build = "~2.7.3"
tauri-plugin-positioner = { version = "=2.4.0", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-notification = "=2.7.0"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-single-instance = "=2.5.4"
netdev = "=0.46.3"
netwatcher = "=0.8.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rusqlite_migration = "=2.6.0"
# Already in the tree through Tauri: reused for the native network APIs.
block2 = "=0.6.2"
dispatch2 = "=0.3.1"
windows = "=0.62.2"
objc2 = "=0.6.5"
objc2-core-wlan = { version = "=0.3.2", default-features = false, features = ["std", "CWChannel", "CWInterface", "CWWiFiClient", "CoreWLANTypes"] }
objc2-core-location = { version = "=0.3.2", default-features = false, features = ["std", "CLLocationManager"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSProcessInfo"] }
objc2-io-kit = { version = "=0.3.2", default-features = false, features = ["std", "libc", "dispatch2", "pwr_mgt"] }
# Already linked by tao on Linux: reusing it adds no native dependency.
dbus = "=0.9.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
unic-langid = { version = "0.9", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
