<!doctype html>
<!--
  PROTOTYPE, throwaway. Question: what should the menu-bar dot, the popover and the dashboard look like?
  Three structurally different variants on one page, switchable via ?variant=A|B|C (bottom bar or arrow keys).
  Data is simulated in memory; nothing is measured. Open this file directly in a browser.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette qualité de connexion</title>
<style>
  :root {
    --bg: #eef0f3; --panel: #ffffff; --ink: #1d2128; --muted: #6b7380; --line: #dfe3e8;
    --solid: #1f9d55; --unstable: #d99a00; --degraded: #d64545; --offline: #8a919c; --measuring: #4a7bd0;
    --solid-soft: #e3f4ea; --unstable-soft: #fbf1d9; --degraded-soft: #fbe4e4; --offline-soft: #eceef1; --measuring-soft: #e4ecfa;
    --menubar: rgba(246,246,248,.92);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181d; --panel: #1f242b; --ink: #e8ebef; --muted: #98a1ad; --line: #313842;
      --solid-soft: #183526; --unstable-soft: #3a3016; --degraded-soft: #3d1d1d; --offline-soft: #2a2f36; --measuring-soft: #1d2a40;
      --menubar: rgba(36,40,46,.92);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-size: 13px; padding-bottom: 80px; }
  h1, h2, h3 { margin: 0; font-weight: 600; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }

  /* Simulator controls: not part of the design under review */
  .sim { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 16px; background: #2b2f36; color: #fff; font-size: 12px; }
  .sim label { display: flex; gap: 6px; align-items: center; }
  .sim select, .sim button { font: inherit; padding: 3px 6px; border-radius: 6px; border: 1px solid #555; background: #3a3f47; color: #fff; }
  .sim .tag { background: #ffcc00; color: #000; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
  details.state { margin: 0 16px; font-size: 11px; }
  details.state pre { background: var(--panel); border: 1px solid var(--line); padding: 8px; border-radius: 8px; max-height: 240px; overflow: auto; }

  /* Fake menu bar */
  .menubar { height: 28px; display: flex; justify-content: flex-end; align-items: center; gap: 16px; padding: 0 16px; background: var(--menubar); border-bottom: 1px solid var(--line); position: relative; }
  .menubar .fake { color: var(--muted); font-size: 12px; }
  .tray { display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 2px 6px; border-radius: 5px; }
  .tray:hover { background: rgba(127,127,127,.18); }
  .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; flex: none; }
  .dot.measuring { animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  .stage { display: grid; grid-template-columns: minmax(300px, 360px) 1fr; gap: 20px; padding: 16px; align-items: start; }
  @media (max-width: 900px) { .stage { grid-template-columns: 1fr; } }
  .caption { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
  .popover { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.12); padding: 14px; }
  .window { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.10); overflow: hidden; }
  .window .titlebar { height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 10px; border-bottom: 1px solid var(--line); }
  .window .titlebar i { width: 11px; height: 11px; border-radius: 50%; background: var(--line); display: inline-block; }
  .window .titlebar span { margin-left: 8px; color: var(--muted); font-size: 12px; }

  .chip { display: inline-flex; gap: 4px; align-items: center; padding: 2px 8px; border-radius: 999px; background: var(--offline-soft); font-size: 11px; margin: 2px 4px 2px 0; }
  .btn { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  .btn.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .row { display: flex; gap: 8px; align-items: center; }
  .spread { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .sep { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: 12px; }
  th { color: var(--muted); font-weight: 500; }

  /* Variant A: gauges */
  .gauge { margin: 10px 0; }
  .gauge .track { position: relative; height: 8px; border-radius: 4px; overflow: hidden; display: flex; }
  .gauge .track span { height: 100%; }
  .gauge .marker { position: absolute; top: -3px; width: 3px; height: 14px; background: var(--ink); border-radius: 2px; }
  .gauge .near { font-size: 11px; color: var(--unstable); }

  /* Variant B: path */
  .path { display: grid; grid-template-columns: auto 1fr auto 1fr auto; align-items: center; gap: 6px; margin: 14px 0 6px; }
  .node { text-align: center; font-size: 11px; color: var(--muted); }
  .node b { display: block; width: 34px; height: 34px; margin: 0 auto 4px; border-radius: 10px; background: var(--offline-soft); line-height: 34px; font-size: 16px; color: var(--ink); }
  .link { height: 6px; border-radius: 3px; position: relative; }
  .link.fault { outline: 2px dashed var(--ink); outline-offset: 3px; }
  .segstats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .segstats > div { padding: 8px; border-radius: 8px; background: var(--offline-soft); }
  .lanes { display: grid; gap: 4px; padding: 12px; }
  .lane { display: grid; grid-template-columns: 110px 1fr 90px; align-items: center; gap: 8px; }
  .ribbon { display: flex; height: 10px; border-radius: 3px; overflow: hidden; }
  .events { padding: 0 12px 12px; }
  .events li { margin: 4px 0; }

  /* Variant C: rings + network cards */
  .rings { display: flex; justify-content: space-between; margin: 12px 0; }
  .ring { text-align: center; font-size: 11px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .tabs button { font: inherit; border: 0; background: none; padding: 6px 8px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--ink); }
  .netcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; padding: 12px; }
  .netcard { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .netcard.best { border-color: var(--solid); box-shadow: 0 0 0 1px var(--solid) inset; }
  .dist { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin: 8px 0; }

  .dashA { display: grid; grid-template-columns: 180px 1fr; min-height: 420px; }
  .dashA aside { border-right: 1px solid var(--line); padding: 12px; }
  .dashA aside .item { padding: 6px 8px; border-radius: 6px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
  .dashA aside .item.on { background: var(--offline-soft); }
  .grid4 { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; padding: 12px; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .periods { display: flex; gap: 4px; }
  .periods button { font: inherit; font-size: 11px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line); background: none; color: var(--ink); cursor: pointer; }
  .periods button.on { background: var(--ink); color: var(--panel); }

  /* Floating switcher: not part of the design under review */
  .switcher { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; background: #111; color: #fff; padding: 8px 12px; border-radius: 999px; box-shadow: 0 6px 20px rgba(0,0,0,.35); z-index: 10; font-size: 13px; }
  .switcher button { background: #333; color: #fff; border: 0; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; font-size: 14px; }
  .switcher b { min-width: 230px; text-align: center; }
</style>
</head>
<body>

<div class="sim">
  <span class="tag">SIMULATEUR</span>
  <label>Scénario
    <select id="scenario">
      <option value="solid">Solide (fibre, Wi-Fi proche)</option>
      <option value="near">Solide mais proche du seuil (partage iPhone)</option>
      <option value="jitter">Instable : gigue côté FAI</option>
      <option value="wifi">Dégradée : Wi-Fi faible</option>
      <option value="isp">Dégradée : FAI (perte)</option>
      <option value="offline">Hors ligne : la box n'a pas d'Internet</option>
      <option value="measuring">Mesure en cours (changement de réseau)</option>
    </select>
  </label>
  <label>Mode
    <select id="mode">
      <option value="local">Local d'abord (par défaut)</option>
      <option value="provider">Fournisseur activé (Cloudflare)</option>
    </select>
  </label>
  <label><input type="checkbox" id="permission" checked> Permission localisation</label>
  <button id="toggle-popover">Ouvrir/fermer le popover</button>
</div>
<details class="state"><summary class="muted">État brut (ce que le moteur Rust enverrait au front)</summary><pre id="state"></pre></details>

<div class="menubar">
  <span class="fake">Finder</span><span class="fake">🔋 87 %</span><span class="fake">Wi-Fi</span>
  <span class="tray" id="tray"></span>
  <span class="fake num" id="clock"></span>
</div>

<div class="stage">
  <div>
    <div class="caption">Popover (clic sur la pastille)</div>
    <div class="popover" id="popover"></div>
  </div>
  <div>
    <div class="caption">Fenêtre dashboard</div>
    <div class="window"><div class="titlebar"><i></i><i></i><i></i><span>Qualité de connexion</span></div><div id="dashboard"></div></div>
  </div>
</div>

<div class="switcher" id="switcher">
  <button id="prev" aria-label="Variante précédente">←</button>
  <b id="variant-label"></b>
  <button id="next" aria-label="Variante suivante">→</button>
</div>

<script>
const VARIANTS = { A: 'Cockpit à jauges', B: 'Chemin réseau + timeline', C: 'Anneaux + comparaison réseaux' };
const KEYS = Object.keys(VARIANTS);
const COLORS = { solid: 'var(--solid)', unstable: 'var(--unstable)', degraded: 'var(--degraded)', offline: 'var(--offline)', measuring: 'var(--measuring)' };
const SOFT = { solid: 'var(--solid-soft)', unstable: 'var(--unstable-soft)', degraded: 'var(--degraded-soft)', offline: 'var(--offline-soft)', measuring: 'var(--measuring-soft)' };
const LABEL = { solid: 'Solide', unstable: 'Instable', degraded: 'Dégradée', offline: 'Hors ligne', measuring: 'Mesure en cours' };
// Thresholds decided in the verdict ticket: [Solide/Instable boundary, Instable/Dégradée boundary]
const THRESHOLDS = { latency: [100, 300], jitter: [30, 50], loss: [1, 5] };
const METRIC = {
  latency: { name: 'Latence', unit: 'ms', pct: 'p90 · 15 s', max: 400 },
  jitter: { name: 'Gigue', unit: 'ms', pct: 'RFC 3550 · 15 s', max: 70 },
  loss: { name: 'Perte', unit: '%', pct: '60 s · 2 cibles', max: 8 },
};

const SCENARIOS = {
  solid:     { lat: 24, jit: 3, loss: 0.1, localLat: 3, localLoss: 0, rssi: -54, phy: 866, band: '5 GHz', channel: 36, net: 'box', peak: 412 },
  near:      { lat: 86, jit: 17, loss: 0.4, localLat: 6, localLoss: 0, rssi: -61, phy: 433, band: '5 GHz', channel: 149, net: 'iphone', peak: 38 },
  jitter:    { lat: 72, jit: 41, loss: 0.7, localLat: 4, localLoss: 0, rssi: -57, phy: 866, band: '5 GHz', channel: 36, net: 'box', peak: 180 },
  wifi:      { lat: 165, jit: 64, loss: 3.4, localLat: 52, localLoss: 2.6, rssi: -79, phy: 58, band: '2,4 GHz', channel: 6, net: 'box', peak: 22 },
  isp:       { lat: 340, jit: 24, loss: 6.2, localLat: 3, localLoss: 0, rssi: -52, phy: 866, band: '5 GHz', channel: 36, net: 'box', peak: 9 },
  offline:   { lat: null, jit: null, loss: 100, localLat: 3, localLoss: 0, rssi: -55, phy: 866, band: '5 GHz', channel: 36, net: 'box', peak: 0 },
  measuring: { lat: null, jit: null, loss: null, localLat: null, localLoss: null, rssi: -58, phy: 866, band: '5 GHz', channel: 44, net: 'office', peak: 0 },
};
const NETWORKS = {
  box:    { label: 'Box maison', ssid: 'Livebox-4F2A', kind: 'Wi-Fi', access: 'Fibre (UPnP)', line: '1000 / 700 Mbit/s', hotspot: false },
  iphone: { label: 'Partage iPhone', ssid: 'iPhone de Lucas', kind: 'Wi-Fi · partage de connexion', access: 'Réseau mobile', line: 'inconnu', hotspot: true },
  office: { label: 'Ethernet bureau', ssid: null, kind: 'Ethernet', access: 'inconnu', line: 'inconnu', hotspot: false },
};
const HISTORY_BY_NETWORK = [
  { id: 'office', solid: 96, unstable: 4, degraded: 0, p50: 9, p90: 14, jit: 2, loss: 0.0, down: 640, up: 610 },
  { id: 'box', solid: 81, unstable: 14, degraded: 5, p50: 21, p90: 38, jit: 6, loss: 0.3, down: 420, up: 310 },
  { id: 'iphone', solid: 52, unstable: 35, degraded: 13, p50: 64, p90: 118, jit: 22, loss: 1.1, down: 48, up: 11 },
];
const TESTS = [
  { when: 'il y a 4 min', profile: 'Flash', down: 412, up: 298, react: 31, mo: 4 },
  { when: 'il y a 34 min', profile: 'Léger', down: 398, up: 305, react: 28, mo: 17 },
  { when: 'hier 18:02', profile: 'Complet', down: 451, up: 322, react: 46, mo: 138 },
];

const ui = { variant: new URLSearchParams(location.search).get('variant') || 'A', popoverOpen: true, period: '1 h', tabC: 'now' };
if (!KEYS.includes(ui.variant)) ui.variant = 'A';
let samples = [];

function jittered(v, spread) { return v === null ? null : Math.max(0, v + (Math.random() - .5) * spread); }

function gradeOf(metric, value) {
  if (value === null) return 'measuring';
  const [a, b] = THRESHOLDS[metric];
  return value < a ? 'solid' : value <= b ? 'unstable' : 'degraded';
}
const RANK = { solid: 0, unstable: 1, degraded: 2 };
function isNearNext(metric, value) {
  const [a, b] = THRESHOLDS[metric];
  const g = gradeOf(metric, value);
  if (g === 'solid') return value >= a * 0.8;
  if (g === 'unstable') return value >= b * 0.8;
  return false;
}

function computeState() {
  const id = document.getElementById('scenario').value;
  const s = SCENARIOS[id];
  const net = NETWORKS[s.net];
  const mode = document.getElementById('mode').value;
  const permission = document.getElementById('permission').checked;
  const internet = { latency: jittered(s.lat, s.lat * .15), jitter: jittered(s.jit, s.jit * .2), loss: s.loss === null ? null : +jittered(s.loss, s.loss * .3).toFixed(1) };
  const local = { latency: jittered(s.localLat, (s.localLat || 0) * .3), loss: s.localLoss };

  let verdict, grades = {};
  if (id === 'offline') verdict = 'offline';
  else if (id === 'measuring') verdict = 'measuring';
  else {
    for (const m of Object.keys(THRESHOLDS)) grades[m] = gradeOf(m, internet[m]);
    verdict = Object.values(grades).sort((x, y) => RANK[y] - RANK[x])[0];
  }
  const worstMetric = Object.keys(grades).find(m => grades[m] === verdict);
  const near = Object.keys(grades).filter(m => isNearNext(m, internet[m]));
  const localBad = local.latency !== null && (local.latency > 30 || local.loss > 1);

  let diagnosis;
  if (verdict === 'offline') diagnosis = { segment: 'internet', text: "La box répond, mais aucune cible Internet ne répond (ping et TCP 443) depuis 5 s : la box n'a pas d'accès Internet." };
  else if (verdict === 'measuring') diagnosis = { segment: null, text: 'Nouveau réseau détecté. Mesure en cours : 6 / 10 échantillons.' };
  else if (verdict === 'solid') diagnosis = { segment: null, text: near.length ? `Connexion solide, mais ${METRIC[near[0]].name.toLowerCase()} proche du seuil Instable.` : 'Connexion solide pour la visio.' };
  else if (localBad) diagnosis = { segment: 'local', text: `Réseau local en cause : ${s.rssi < -70 ? 'signal Wi-Fi faible (' + s.rssi + ' dBm), rapproche-toi de la box' : 'perte vers la box'}. ${METRIC[worstMetric].name} ${fmt(worstMetric, internet[worstMetric])} (${METRIC[worstMetric].pct}).` };
  else diagnosis = { segment: 'internet', text: `${net.hotspot ? 'Réseau mobile' : "Fournisseur d'accès"} en cause, ton Wi-Fi va bien. ${METRIC[worstMetric].name} ${fmt(worstMetric, internet[worstMetric])} (${METRIC[worstMetric].pct}).` };

  const provider = mode === 'provider';
  return {
    verdict, grades, near, diagnosis, internet, local, mode,
    network: { ...net, id: s.net, ssid: permission ? net.ssid : (net.ssid ? 'Wi-Fi (nom masqué)' : null) },
    wifi: net.kind.startsWith('Wi-Fi') ? { rssi: s.rssi, phy: s.phy, band: s.band, channel: s.channel } : null,
    passive: { peakMbps: s.peak, when: 'il y a 12 min' },
    upnp: { access: net.access, line: net.line },
    throughput: provider ? { last: TESTS[0], tests: TESTS, cap: verdict === 'solid' ? null : null } : null,
    dataUsedThisMonthGo: provider ? 3.4 : 0,
  };
}

function fmt(metric, v) {
  if (v === null || v === undefined) return '—';
  return metric === 'loss' ? `${(+v).toFixed(1)} %` : `${Math.round(v)} ms`;
}

function sparkline(values, metric, w = 260, h = 54) {
  const max = METRIC[metric].max;
  const pts = values.map((v, i) => `${(i / Math.max(1, values.length - 1)) * w},${h - Math.min(1, (v ?? 0) / max) * h}`).join(' ');
  const [a, b] = THRESHOLDS[metric];
  const ya = h - (a / max) * h, yb = h - (b / max) * h;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
    <rect x="0" y="0" width="${w}" height="${Math.max(0, yb)}" fill="var(--degraded-soft)"/>
    <rect x="0" y="${yb}" width="${w}" height="${ya - yb}" fill="var(--unstable-soft)"/>
    <rect x="0" y="${ya}" width="${w}" height="${h - ya}" fill="var(--solid-soft)"/>
    <polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-width="1.5"/></svg>`;
}

function gaugeA(metric, st) {
  const v = st.internet[metric];
  const { max } = METRIC[metric];
  const [a, b] = THRESHOLDS[metric];
  const g = st.grades[metric] || st.verdict;
  const pos = v === null ? 0 : Math.min(100, (v / max) * 100);
  return `<div class="gauge">
    <div class="spread"><span>${METRIC[metric].name} <span class="muted">${METRIC[metric].pct}</span></span>
      <b class="num" style="color:${COLORS[g]}">${fmt(metric, v)}</b></div>
    <div class="track" style="position:relative;margin-top:4px">
      <span style="width:${a / max * 100}%;background:var(--solid-soft)"></span>
      <span style="width:${(b - a) / max * 100}%;background:var(--unstable-soft)"></span>
      <span style="flex:1;background:var(--degraded-soft)"></span>
      ${v === null ? '' : `<i class="marker" style="left:calc(${pos}% - 1px)"></i>`}
    </div>
    ${st.near.includes(metric) ? `<div class="near">Proche du seuil suivant</div>` : ''}
  </div>`;
}

function contextChips(st) {
  const n = st.network;
  return [n.kind, n.ssid, st.wifi && `${st.wifi.band} · canal ${st.wifi.channel}`, st.wifi && `${st.wifi.rssi} dBm`, st.upnp.access !== 'inconnu' && st.upnp.access]
    .filter(Boolean).map(c => `<span class="chip">${c}</span>`).join('');
}

function throughputBlock(st) {
  if (!st.throughput) return `<div class="muted">Débit : mode local. Pic observé <b class="num">${st.passive.peakMbps} Mbit/s</b> ${st.passive.when} · ligne ${st.upnp.line}.</div>
    <div class="muted" style="font-size:11px;margin-top:4px">Tests actifs désactivés. Activables dans les réglages.</div>`;
  const t = st.throughput.last;
  return `<div class="spread"><span>Débit <span class="muted">(${t.profile}, ${t.when})</span></span><b class="num">↓ ${t.down} · ↑ ${t.up} Mbit/s</b></div>
    <div class="muted" style="font-size:11px">Réactivité en charge ${t.react} ms · pic passif ${st.passive.peakMbps} Mbit/s</div>`;
}

function actions(st) {
  const off = !st.throughput;
  return `<div class="row" style="margin-top:12px;flex-wrap:wrap">
    <button class="btn" ${off ? 'disabled title="Mode local"' : ''}>Test rapide</button>
    <button class="btn" ${off ? 'disabled title="Mode local"' : ''}>Tester maintenant</button>
    <span style="flex:1"></span><button class="btn primary">Dashboard</button></div>`;
}

/* ---------- Variant A: cockpit with gauges ---------- */
function trayA(st) { return `<i class="dot ${st.verdict}" style="background:${COLORS[st.verdict]}"></i>`; }
function popoverA(st) {
  return `<div class="spread"><div class="row"><i class="dot ${st.verdict}" style="width:16px;height:16px;background:${COLORS[st.verdict]}"></i><h2>${LABEL[st.verdict]}</h2></div><span class="muted">${st.network.label}</span></div>
    <p style="margin:8px 0;padding:8px;border-radius:8px;background:${SOFT[st.verdict]}">${st.diagnosis.text}</p>
    ${Object.keys(METRIC).map(m => gaugeA(m, st)).join('')}
    <hr class="sep"><div>${contextChips(st)}</div>
    <hr class="sep">${throughputBlock(st)}${actions(st)}`;
}
function dashboardA(st) {
  const nets = HISTORY_BY_NETWORK.map(h => `<div class="item ${h.id === st.network.id ? 'on' : ''}"><i class="dot" style="background:${COLORS[h.solid > 90 ? 'solid' : h.solid > 70 ? 'unstable' : 'degraded']}"></i>${NETWORKS[h.id].label}</div>`).join('');
  const charts = Object.keys(METRIC).map(m => `<div class="card"><div class="spread"><b>${METRIC[m].name}</b><span class="muted num">${fmt(m, st.internet[m])} · ${METRIC[m].pct}</span></div>${sparkline(samples.map(x => x[m]), m)}</div>`).join('');
  const tests = st.throughput ? `<table><tr><th>Quand</th><th>Profil</th><th>↓ Mbit/s</th><th>↑ Mbit/s</th><th>Réactivité</th><th>Data</th></tr>
      ${st.throughput.tests.map((t, i, arr) => `<tr><td>${t.when}</td><td>${t.profile}</td><td class="num">${t.down} ${i < arr.length - 1 ? (t.down >= arr[i + 1].down ? '↑' : '↓') : ''}</td><td class="num">${t.up}</td><td class="num">${t.react} ms</td><td class="num">${t.mo} Mo</td></tr>`).join('')}</table>
      <div class="muted" style="margin-top:6px">Ce mois : ${st.dataUsedThisMonthGo} Go / 15 Go</div>`
    : `<div class="muted">Mode local : pics passifs seulement. Pic ${st.passive.peakMbps} Mbit/s ${st.passive.when}, ligne ${st.upnp.line}.</div>`;
  return `<div class="dashA"><aside><div class="caption">Réseaux</div>${nets}<hr class="sep"><div class="caption">Période</div>
      <div class="periods">${['1 h', '24 h', '7 j', '30 j'].map(p => `<button class="${p === ui.period ? 'on' : ''}" data-period="${p}">${p}</button>`).join('')}</div></aside>
    <section><div class="grid4">${charts}<div class="card"><b>Tronçon local</b><div class="muted num" style="margin-top:6px">Box : ${fmt('latency', st.local.latency)} · perte ${st.local.loss ?? '—'} %</div>
      ${st.wifi ? `<div class="muted num">Wi-Fi ${st.wifi.rssi} dBm · PHY ${st.wifi.phy} Mbit/s · ${st.wifi.band}</div>` : ''}</div></div>
      <div style="padding:0 12px 12px"><div class="caption">Tests de débit</div>${tests}</div></section></div>`;
}

/* ---------- Variant B: network path + timeline ---------- */
function trayB(st) { return `<i class="dot ${st.verdict}" style="background:${COLORS[st.verdict]}"></i><span class="num" style="font-size:12px">${st.internet.latency === null ? '…' : Math.round(st.internet.latency) + ' ms'}</span>`; }
function linkColor(bad, unknown) { return unknown ? 'var(--offline)' : bad ? 'var(--degraded)' : 'var(--solid)'; }
function popoverB(st) {
  const localUnknown = st.local.latency === null;
  const localBad = !localUnknown && (st.local.latency > 30 || st.local.loss > 1);
  const netBad = st.verdict === 'degraded' || st.verdict === 'unstable' || st.verdict === 'offline';
  const netColor = st.verdict === 'measuring' ? 'var(--offline)' : st.verdict === 'offline' ? 'var(--offline)' : COLORS[st.verdict];
  return `<div class="row"><i class="dot ${st.verdict}" style="background:${COLORS[st.verdict]}"></i><b>${LABEL[st.verdict]}</b><span class="muted">· ${st.network.label}</span></div>
    <div class="path">
      <div class="node"><b>💻</b>Poste</div>
      <div class="link ${st.diagnosis.segment === 'local' ? 'fault' : ''}" style="background:${linkColor(localBad, localUnknown)}"></div>
      <div class="node"><b>${st.network.hotspot ? '📱' : '📶'}</b>${st.network.hotspot ? 'iPhone' : 'Box'}</div>
      <div class="link ${st.diagnosis.segment === 'internet' ? 'fault' : ''}" style="background:${netColor}"></div>
      <div class="node"><b>🌐</b>Internet</div>
    </div>
    <p style="margin:10px 0">${st.diagnosis.text}</p>
    <div class="segstats">
      <div><div class="caption">Poste → box</div><div class="num">${fmt('latency', st.local.latency)} · perte ${st.local.loss ?? '—'} %</div>${st.wifi ? `<div class="muted num">${st.wifi.rssi} dBm · ${st.wifi.band}</div>` : ''}</div>
      <div><div class="caption">Bout en bout</div><div class="num">${fmt('latency', st.internet.latency)} p90 · gigue ${fmt('jitter', st.internet.jitter)}</div><div class="muted num">perte ${fmt('loss', st.internet.loss)} (60 s)</div></div>
    </div>
    <hr class="sep">${throughputBlock(st)}${actions(st)}`;
}
function dashboardB(st) {
  const ribbon = samples.map(x => `<span style="flex:1;background:${COLORS[x.verdict]}"></span>`).join('');
  const lanes = Object.keys(METRIC).map(m => `<div class="lane"><span>${METRIC[m].name}<br><span class="muted" style="font-size:11px">${METRIC[m].pct}</span></span>${sparkline(samples.map(x => x[m]), m, 600, 40)}<b class="num" style="text-align:right">${fmt(m, st.internet[m])}</b></div>`).join('');
  return `<div class="spread" style="padding:12px 12px 0"><h3>Timeline · ${st.network.label}</h3><div class="periods">${['1 h', '24 h', '7 j', '30 j'].map(p => `<button class="${p === ui.period ? 'on' : ''}" data-period="${p}">${p}</button>`).join('')}</div></div>
    <div class="lanes"><div class="lane"><span>Verdict</span><div class="ribbon">${ribbon}</div><span></span></div>${lanes}</div>
    <ul class="events muted">
      <li>14:02 · Changement de réseau : ${st.network.label} (${st.network.kind})</li>
      <li>13:48 · Dégradée pendant 2 min : perte 6 % (fournisseur d'accès)</li>
      ${st.throughput ? `<li>13:30 · Test léger : ↓ 398 · ↑ 305 Mbit/s</li>` : `<li>13:30 · Pic passif : ${st.passive.peakMbps} Mbit/s</li>`}
    </ul>`;
}

/* ---------- Variant C: rings + network comparison ---------- */
function ring(metric, st, size = 74) {
  const v = st.internet[metric];
  const g = st.grades[metric] || st.verdict;
  const r = size / 2 - 6, c = 2 * Math.PI * r;
  const frac = v === null ? 0 : Math.min(1, v / METRIC[metric].max);
  return `<div class="ring"><svg width="${size}" height="${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="6"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${COLORS[g]}" stroke-width="6" stroke-dasharray="${c * frac} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})" stroke-linecap="round"/>
    <text x="50%" y="52%" text-anchor="middle" font-size="13" fill="var(--ink)" class="num">${fmt(metric, v)}</text></svg>
    <div>${METRIC[metric].name}</div><div class="muted">${METRIC[metric].pct.split(' · ')[0]}${st.near.includes(metric) ? ' · proche' : ''}</div></div>`;
}
function trayC(st) {
  return `<svg width="16" height="16"><circle cx="8" cy="8" r="6.5" fill="none" stroke="${COLORS[st.verdict]}" stroke-width="2"/><circle cx="8" cy="8" r="3.5" fill="${COLORS[st.verdict]}"/></svg>`;
}
function popoverC(st) {
  const tab = ui.tabC;
  const body = tab === 'now' ? `<div class="rings">${Object.keys(METRIC).map(m => ring(m, st)).join('')}</div><p style="margin:6px 0">${st.diagnosis.text}</p>`
    : tab === 'context' ? `<table>
        <tr><td>Réseau</td><td>${st.network.label}</td></tr><tr><td>Type</td><td>${st.network.kind}</td></tr>
        <tr><td>SSID</td><td>${st.network.ssid ?? '—'}</td></tr><tr><td>Accès</td><td>${st.upnp.access}</td></tr><tr><td>Ligne (UPnP)</td><td>${st.upnp.line}</td></tr>
        ${st.wifi ? `<tr><td>Wi-Fi</td><td class="num">${st.wifi.rssi} dBm · PHY ${st.wifi.phy} Mbit/s · ${st.wifi.band} canal ${st.wifi.channel}</td></tr>` : ''}
        <tr><td>Tronçon local</td><td class="num">${fmt('latency', st.local.latency)} · perte ${st.local.loss ?? '—'} %</td></tr></table>`
    : `${throughputBlock(st)}${actions(st)}`;
  return `<div class="spread"><div class="row"><i class="dot ${st.verdict}" style="background:${COLORS[st.verdict]}"></i><b>${LABEL[st.verdict]}</b></div><span class="muted">${st.network.label}</span></div>
    <div class="tabs" style="margin-top:10px">${[['now', 'Maintenant'], ['context', 'Contexte'], ['speed', 'Débit']].map(([k, l]) => `<button class="${k === tab ? 'on' : ''}" data-tab="${k}">${l}</button>`).join('')}</div>${body}`;
}
function dashboardC(st) {
  const best = HISTORY_BY_NETWORK[0];
  const cards = HISTORY_BY_NETWORK.map(h => `<div class="netcard ${h === best ? 'best' : ''}">
      <div class="spread"><b>${NETWORKS[h.id].label}</b>${h === best ? '<span class="chip" style="background:var(--solid-soft)">Meilleur pour la visio</span>' : ''}</div>
      <div class="muted">${NETWORKS[h.id].kind}</div>
      <div class="dist"><span style="width:${h.solid}%;background:var(--solid)"></span><span style="width:${h.unstable}%;background:var(--unstable)"></span><span style="width:${h.degraded}%;background:var(--degraded)"></span></div>
      <div class="muted" style="font-size:11px">${h.solid} % du temps Solide · 30 j</div>
      <table><tr><td>Latence</td><td class="num">p50 ${h.p50} ms · p90 ${h.p90} ms</td></tr><tr><td>Gigue</td><td class="num">${h.jit} ms</td></tr><tr><td>Perte</td><td class="num">${h.loss} %</td></tr>
      <tr><td>Débit</td><td class="num">${st.throughput ? `↓ ${h.down} · ↑ ${h.up}` : `pic passif ${Math.round(h.down / 3)}`} Mbit/s</td></tr></table></div>`).join('');
  return `<div style="padding:12px 12px 0"><h3>Quelle connexion est la meilleure pour moi ?</h3><div class="muted">Comparaison sur 30 jours, triée par temps passé en Solide.</div></div>
    <div class="netcards">${cards}</div>
    <div style="padding:0 12px 12px"><div class="caption">Maintenant · ${st.network.label}</div>${sparkline(samples.map(x => x.latency), 'latency', 600, 50)}</div>`;
}

const RENDER = { A: [trayA, popoverA, dashboardA], B: [trayB, popoverB, dashboardB], C: [trayC, popoverC, dashboardC] };

function tick() {
  const st = computeState();
  samples.push({ verdict: st.verdict, latency: st.internet.latency, jitter: st.internet.jitter, loss: st.internet.loss });
  if (samples.length > 90) samples.shift();
  const [tray, pop, dash] = RENDER[ui.variant];
  document.getElementById('tray').innerHTML = tray(st);
  const popEl = document.getElementById('popover');
  popEl.style.display = ui.popoverOpen ? '' : 'none';
  popEl.innerHTML = pop(st);
  document.getElementById('dashboard').innerHTML = dash(st);
  document.getElementById('state').textContent = JSON.stringify(st, null, 2);
  document.getElementById('variant-label').textContent = `${ui.variant} (${VARIANTS[ui.variant]})`;
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

function setVariant(step) {
  const i = (KEYS.indexOf(ui.variant) + step + KEYS.length) % KEYS.length;
  ui.variant = KEYS[i];
  const url = new URL(location.href); url.searchParams.set('variant', ui.variant); window.history.replaceState(null, '', url);
  tick();
}

function resetHistory() { samples = []; for (let i = 0; i < 60; i++) { const st = computeState(); samples.push({ verdict: st.verdict, latency: st.internet.latency, jitter: st.internet.jitter, loss: st.internet.loss }); } tick(); }

document.getElementById('prev').onclick = () => setVariant(-1);
document.getElementById('next').onclick = () => setVariant(1);
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') setVariant(-1);
  if (e.key === 'ArrowRight') setVariant(1);
});
['scenario', 'mode', 'permission'].forEach(id => document.getElementById(id).addEventListener('change', resetHistory));
document.getElementById('toggle-popover').onclick = () => { ui.popoverOpen = !ui.popoverOpen; tick(); };
document.getElementById('tray').onclick = () => { ui.popoverOpen = !ui.popoverOpen; tick(); };
document.addEventListener('click', e => {
  const p = e.target.closest('[data-period]'); if (p) { ui.period = p.dataset.period; tick(); }
  const t = e.target.closest('[data-tab]'); if (t) { ui.tabC = t.dataset.tab; tick(); }
});
resetHistory();
setInterval(tick, 1000);
</script>
</body>
</html>
