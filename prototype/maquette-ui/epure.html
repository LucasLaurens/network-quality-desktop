<!doctype html>
<!--
  PROTOTYPE, throwaway. Clean direction built from the confirmed design brief (ticket #15), second pass:
  settings page, system theme by default, speed tests only on click, overview of the situation, clearer metrics.
  Open this file directly in a browser. The dark strip at the top is the simulator, not the design.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qualité de connexion, maquette épurée</title>
<style>
  :root {
    color-scheme: light dark;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    /* Neutrals tinted toward a warm stone hue; colour is reserved for state. */
    --bg: oklch(97.6% 0.004 85);
    --surface: oklch(99.4% 0.003 85);
    --sunken: oklch(95.2% 0.005 85);
    --ink: oklch(23% 0.01 85);
    --muted: oklch(48% 0.012 85);
    --line: oklch(90% 0.006 85);
    --zone: oklch(93.5% 0.005 85);
    --focus: oklch(55% 0.12 250);
    --solid: oklch(56% 0.13 150);
    --unstable: oklch(62% 0.14 70);
    --degraded: oklch(55% 0.18 27);
    --offline: oklch(56% 0.01 85);
    --measuring: oklch(56% 0.1 250);
    --shadow: 0 1px 2px oklch(20% 0.01 85 / .06), 0 12px 32px oklch(20% 0.01 85 / .10);
    --radius: 8px;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
    --t-xs: 11px; --t-sm: 12px; --t-md: 13px; --t-lg: 16px; --t-xl: 19px; --t-2xl: 28px;
  }
  /* Dark tokens, applied when the OS is dark (theme "Système") or when "Sombre" is chosen in Réglages. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: oklch(18.5% 0.006 85); --surface: oklch(22% 0.007 85); --sunken: oklch(20% 0.006 85);
      --ink: oklch(94% 0.006 85); --muted: oklch(71% 0.01 85); --line: oklch(31% 0.008 85); --zone: oklch(31% 0.008 85);
      --focus: oklch(72% 0.11 250);
      --solid: oklch(72% 0.14 150); --unstable: oklch(80% 0.14 75); --degraded: oklch(68% 0.17 27);
      --offline: oklch(66% 0.01 85); --measuring: oklch(70% 0.1 250);
      --shadow: 0 1px 2px oklch(0% 0 0 / .3), 0 12px 32px oklch(0% 0 0 / .45);
    }
  }
  :root[data-theme="dark"] {
    --bg: oklch(18.5% 0.006 85); --surface: oklch(22% 0.007 85); --sunken: oklch(20% 0.006 85);
    --ink: oklch(94% 0.006 85); --muted: oklch(71% 0.01 85); --line: oklch(31% 0.008 85); --zone: oklch(31% 0.008 85);
    --focus: oklch(72% 0.11 250);
    --solid: oklch(72% 0.14 150); --unstable: oklch(80% 0.14 75); --degraded: oklch(68% 0.17 27);
    --offline: oklch(66% 0.01 85); --measuring: oklch(70% 0.1 250);
    --shadow: 0 1px 2px oklch(0% 0 0 / .3), 0 12px 32px oklch(0% 0 0 / .45);
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: var(--t-md)/1.45 var(--font); -webkit-font-smoothing: antialiased; }
  h1, h2, h3, p { margin: 0; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .small { font-size: var(--t-xs); color: var(--muted); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

  /* Simulator: outside the design under review */
  .sim { display: flex; flex-wrap: wrap; gap: var(--s3); align-items: center; padding: var(--s2) var(--s4); background: oklch(28% 0.01 85); color: oklch(96% 0.004 85); font-size: var(--t-sm); }
  .sim select { font: inherit; padding: 2px 6px; border-radius: 6px; border: 1px solid oklch(40% 0.01 85); background: oklch(33% 0.01 85); color: inherit; }
  .sim label { display: flex; gap: 6px; align-items: center; }
  .sim strong { letter-spacing: .04em; }

  /* Fake menu bar */
  .menubar { height: 26px; display: flex; justify-content: flex-end; align-items: center; gap: var(--s4); padding: 0 var(--s4); background: var(--sunken); border-bottom: 1px solid var(--line); font-size: var(--t-sm); }
  .menubar .other { color: var(--muted); }
  .tray { display: inline-flex; align-items: center; padding: 3px 6px; border-radius: 6px; border: 0; background: none; color: inherit; cursor: pointer; }
  .tray:hover, .tray[aria-expanded="true"] { background: var(--line); }

  .stage { display: flex; flex-wrap: wrap; gap: var(--s6); padding: var(--s5) var(--s4) var(--s7); align-items: flex-start; }
  .label { font-size: var(--t-xs); color: var(--muted); margin-bottom: var(--s2); }
  .shape { flex: none; display: inline-block; }

  /* Popover */
  .popover { width: 320px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: var(--s4); }
  .pop-head { display: flex; align-items: center; gap: var(--s2); }
  .pop-head h2 { font-size: var(--t-xl); font-weight: 600; }
  .pop-head .where { margin-left: auto; color: var(--muted); font-size: var(--t-sm); }
  .cause { margin-top: var(--s2); }
  .pop-metrics { margin-top: var(--s4); display: grid; gap: var(--s3); }
  .pm { display: grid; grid-template-columns: 1fr auto; row-gap: var(--s1); align-items: baseline; }
  .pm .val { font-weight: 600; }
  .pm .range { grid-column: 1 / -1; }
  .divider { border: 0; border-top: 1px solid var(--line); margin: var(--s4) 0; }
  .quiet-line { font-size: var(--t-sm); color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: var(--s2); }

  /* Buttons: one filled primary per view */
  .btn { font: inherit; font-weight: 500; min-height: 32px; padding: 0 var(--s3); border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
  .btn:hover:not(:disabled) { background: var(--sunken); }
  .btn:disabled { color: var(--muted); cursor: not-allowed; }
  .btn[aria-busy="true"] { cursor: progress; }
  .btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); width: 100%; margin-top: var(--s4); }
  .btn.primary:hover { background: oklch(from var(--ink) calc(l + .06) c h); }
  .link { font: inherit; border: 0; background: none; padding: var(--s1) 0; min-height: 28px; color: var(--ink); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }

  /* Range bar: neutral zones, marker shows the value */
  .range { position: relative; height: 6px; display: flex; gap: 2px; }
  .range span { height: 100%; background: var(--zone); border-radius: 2px; }
  .range i { position: absolute; top: -3px; width: 3px; height: 12px; border-radius: 2px; background: var(--ink); }

  /* Path: Ce Mac, box, Internet */
  .path { display: grid; grid-template-columns: auto 1fr auto 1fr auto; align-items: center; column-gap: var(--s2); row-gap: var(--s1); margin-top: var(--s4); }
  .path .node { font-size: var(--t-sm); white-space: nowrap; }
  .path .seg { height: 4px; border-radius: 2px; background: var(--line); }
  .path .seg.fault { height: 6px; }
  .path .seg.cut { height: 0; background: none; border-top: 3px dashed var(--offline); }
  .path .seg-label { font-size: var(--t-xs); color: var(--muted); text-align: center; }
  .path .seg-label b { color: var(--ink); font-weight: 600; }

  /* Window */
  .window { flex: 1 1 640px; max-width: 900px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .titlebar { height: 44px; display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s4); border-bottom: 1px solid var(--line); }
  .titlebar .lights { display: flex; gap: 8px; }
  .titlebar .lights i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
  .titlebar h1 { font-size: var(--t-md); font-weight: 600; margin-left: var(--s3); }
  .titlebar nav { margin-left: auto; }
  .content { padding: var(--s6) var(--s6) var(--s5); }
  section + section { margin-top: var(--s7); }
  .sec-head { display: flex; align-items: baseline; gap: var(--s4); flex-wrap: wrap; margin-bottom: var(--s4); }
  .sec-head h2 { font-size: var(--t-lg); font-weight: 600; }
  .sec-head .controls { margin-left: auto; display: flex; gap: var(--s3); flex-wrap: wrap; }

  /* The answer */
  .answer-head { display: flex; align-items: center; gap: var(--s3); }
  .answer-head h2 { font-size: var(--t-2xl); font-weight: 600; letter-spacing: -0.01em; }
  .answer-head .net { margin-left: auto; text-align: right; font-size: var(--t-sm); }
  .answer .cause { font-size: var(--t-lg); max-width: 62ch; }
  .answer .path { max-width: 640px; margin-top: var(--s5); }

  /* Overview: the global picture, as facts in a row, not cards */
  .overview { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s4); margin-top: var(--s6); padding: var(--s4) 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .fact { display: grid; gap: var(--s1); align-content: start; }
  .fact .k { font-size: var(--t-xs); color: var(--muted); }
  .fact .v { font-weight: 600; }

  .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .metric { padding: 0 var(--s5) 0 0; display: grid; gap: var(--s1); align-content: start; }
  .metric + .metric { padding-left: var(--s5); border-left: 1px solid var(--line); }
  .metric .name { font-weight: 600; }
  .metric .what { font-size: var(--t-xs); color: var(--muted); min-height: calc(2 * 1.45em); }
  .metric .val { font-size: var(--t-xl); font-weight: 600; margin-top: var(--s2); }
  .metric .range { margin: var(--s2) 0 var(--s1); }

  /* Segmented controls */
  .seg-ctl { display: inline-flex; padding: 2px; background: var(--sunken); border: 1px solid var(--line); border-radius: var(--radius); }
  .seg-ctl button { font: inherit; font-size: var(--t-sm); min-height: 28px; padding: 0 var(--s3); border: 0; border-radius: 6px; background: none; color: var(--muted); cursor: pointer; }
  .seg-ctl button[aria-pressed="true"], .seg-ctl button[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }

  /* Chart */
  .chart > svg { display: block; width: 100%; max-width: 820px; height: auto; overflow: visible; }
  .chart .axis { font-size: 12px; fill: var(--muted); }
  .ribbon { display: flex; height: 6px; margin-top: var(--s2); }
  .ribbon span { flex: 1; }
  .legend { display: flex; gap: var(--s4); flex-wrap: wrap; margin-top: var(--s2); font-size: var(--t-xs); color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }

  /* Tables */
  table { border-collapse: collapse; width: 100%; }
  th { font-size: var(--t-xs); font-weight: 500; color: var(--muted); text-align: left; padding: 0 var(--s3) var(--s2) 0; border-bottom: 1px solid var(--line); }
  td { padding: var(--s3) var(--s3) var(--s3) 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
  td.r, th.r { text-align: right; }
  .stack { display: flex; height: 6px; width: 140px; gap: 1px; }
  .stack span { height: 100%; }
  .tag { font-size: var(--t-xs); color: var(--muted); margin-left: var(--s2); }

  /* Details */
  details > summary { cursor: pointer; font-size: var(--t-lg); font-weight: 600; list-style: none; display: flex; align-items: center; gap: var(--s2); }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(-45deg); }
  details[open] > summary::before { transform: rotate(45deg); }
  .details-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--s5); margin-top: var(--s4); }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: var(--s2) var(--s4); }
  dt { color: var(--muted); }
  dd { margin: 0; }
  .details-grid h3 { font-size: var(--t-sm); font-weight: 600; margin-bottom: var(--s2); }
  .test-actions { display: flex; gap: var(--s2); flex-wrap: wrap; }
  .foot { margin-top: var(--s6); font-size: var(--t-xs); color: var(--muted); }
  .empty { padding: var(--s5) 0; color: var(--muted); }

  /* Settings page: native-feeling grouped form */
  .settings { max-width: 640px; }
  .settings h2 { font-size: var(--t-2xl); font-weight: 600; letter-spacing: -0.01em; }
  .group { margin-top: var(--s6); }
  .group h3 { font-size: var(--t-sm); font-weight: 600; color: var(--muted); margin-bottom: var(--s2); }
  .rows { border: 1px solid var(--line); border-radius: var(--radius); }
  .setting { display: grid; grid-template-columns: 1fr auto; gap: var(--s1) var(--s4); align-items: center; padding: var(--s3) var(--s4); }
  .setting + .setting { border-top: 1px solid var(--line); }
  .setting .hint { grid-column: 1; font-size: var(--t-xs); color: var(--muted); }
  .setting label { font-weight: 500; }
  .setting select, .setting input[type="text"] { font: inherit; min-height: 28px; padding: 0 var(--s2); border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
  input[type="checkbox"][role="switch"] { appearance: none; width: 36px; height: 22px; border-radius: 11px; background: var(--line); position: relative; cursor: pointer; margin: 0; }
  input[type="checkbox"][role="switch"]::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); }
  input[type="checkbox"][role="switch"]:checked { background: var(--solid); }
  input[type="checkbox"][role="switch"]:checked::after { left: 17px; }
  .radios { display: inline-flex; gap: var(--s3); }
  .radios label { font-weight: 400; display: inline-flex; gap: var(--s1); align-items: center; }
  .saved { margin-top: var(--s4); font-size: var(--t-xs); color: var(--muted); min-height: 1em; }

  @media (prefers-reduced-motion: no-preference) {
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .4; } }
    input[type="checkbox"][role="switch"]::after, details > summary::before { transition: left .15s ease-out, transform .15s ease-out; }
  }
  @media (max-width: 720px) {
    .content { padding: var(--s5) var(--s4); }
    .metrics, .overview { grid-template-columns: 1fr 1fr; }
    .metric + .metric { padding-left: 0; border-left: 0; }
    .stack { width: 80px; }
  }
</style>
</head>
<body>

<div class="sim" role="region" aria-label="Simulateur de maquette">
  <strong>SIMULATEUR</strong>
  <label>Scénario <select id="scenario">
    <option value="solid">Solide</option>
    <option value="near">Solide, proche du seuil (partage iPhone)</option>
    <option value="jitter">Instable, gigue côté opérateur</option>
    <option value="wifi">Dégradée, Wi-Fi faible</option>
    <option value="isp">Dégradée, perte chez l'opérateur</option>
    <option value="offline">Hors ligne, box sans Internet</option>
    <option value="measuring">Mesure en cours (nouveau réseau)</option>
    <option value="first">Premier lancement (historique vide)</option>
  </select></label>
  <label><input type="checkbox" id="permission" checked> Permission localisation</label>
  <span>Le thème et les tests se règlent dans la page Réglages de la fenêtre.</span>
</div>

<div class="menubar">
  <span class="other">Finder</span><span class="other">Batterie 87 %</span>
  <button class="tray" id="tray" aria-haspopup="dialog" aria-expanded="true" aria-controls="popover"></button>
  <span class="other num" id="clock"></span>
</div>

<div class="stage">
  <div>
    <div class="label">Popover, ouvert depuis la barre des menus</div>
    <div class="popover" id="popover" role="dialog" aria-label="État de la connexion"></div>
  </div>
  <div class="window" role="region" aria-label="Fenêtre Qualité de connexion">
    <div class="titlebar"><span class="lights" aria-hidden="true"><i></i><i></i><i></i></span><h1>Qualité de connexion</h1>
      <nav class="seg-ctl" aria-label="Pages"><button data-view="dashboard">Tableau de bord</button><button data-view="settings">Réglages</button></nav></div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
const THRESHOLDS = { latency: [100, 300], jitter: [30, 50], loss: [1, 5] };
const METRICS = {
  latency: { name: 'Latence', what: 'Temps d\'un aller-retour vers Internet', how: '90 % des mesures des 15 dernières secondes sont sous cette valeur', short: 'p90, 15 s', unit: 'ms', max: 400 },
  jitter: { name: 'Gigue', what: 'Variation de la latence d\'un paquet à l\'autre', how: 'Calculée sur les 15 dernières secondes', short: '15 s', unit: 'ms', max: 70 },
  loss: { name: 'Perte', what: 'Paquets envoyés qui ne reviennent pas', how: 'Sur la dernière minute, vers 2 serveurs', short: '60 s', unit: '%', max: 8 },
};
const STATE_WORD = { solid: 'Solide', unstable: 'Instable', degraded: 'Dégradée', offline: 'Hors ligne', measuring: 'Mesure en cours' };
const RANK = { solid: 0, unstable: 1, degraded: 2 };
const NETWORKS = {
  box: { name: 'Box maison', ssid: 'Livebox-4F2A', kind: 'Wi-Fi', access: 'Fibre (déclarée par la box)', line: '1 000 / 700 Mbit/s', hotspot: false, vpn: 'Non', metered: 'Non' },
  iphone: { name: 'Partage iPhone', ssid: 'iPhone de Lucas', kind: 'Wi-Fi, partage de connexion', access: 'Réseau mobile', line: 'Inconnue', hotspot: true, vpn: 'Non', metered: 'Oui' },
  office: { name: 'Ethernet bureau', ssid: null, kind: 'Ethernet', access: 'Inconnu', line: 'Inconnue', hotspot: false, vpn: 'Non', metered: 'Non' },
};
const SCENARIOS = {
  solid: { lat: 24, jit: 3, loss: 0.1, localLat: 3, localLoss: 0, rssi: -54, noise: -92, phy: 866, band: '5 GHz', channel: 36, net: 'box', peak: 412,
    day: { solid: 97, cuts: 'Aucune', worst: '11:20, latence 140 ms', since: '3 h 12' } },
  near: { lat: 86, jit: 17, loss: 0.4, localLat: 6, localLoss: 0, rssi: -61, noise: -90, phy: 433, band: '5 GHz', channel: 149, net: 'iphone', peak: 38,
    day: { solid: 71, cuts: 'Aucune', worst: '15:02, latence 210 ms', since: '42 min' } },
  jitter: { lat: 72, jit: 41, loss: 0.7, localLat: 4, localLoss: 0, rssi: -57, noise: -91, phy: 866, band: '5 GHz', channel: 36, net: 'box', peak: 180,
    day: { solid: 84, cuts: 'Aucune', worst: 'Maintenant, gigue 41 ms', since: '3 h 12' } },
  wifi: { lat: 165, jit: 64, loss: 3.4, localLat: 52, localLoss: 2.6, rssi: -79, noise: -88, phy: 58, band: '2,4 GHz', channel: 6, net: 'box', peak: 22,
    day: { solid: 62, cuts: '2, la plus longue 40 s', worst: 'Maintenant, gigue 64 ms', since: '3 h 12' } },
  isp: { lat: 340, jit: 24, loss: 6.2, localLat: 3, localLoss: 0, rssi: -52, noise: -92, phy: 866, band: '5 GHz', channel: 36, net: 'box', peak: 9,
    day: { solid: 74, cuts: '1, à 13:48 (2 min)', worst: 'Maintenant, perte 6 %', since: '3 h 12' } },
  offline: { lat: null, jit: null, loss: null, localLat: 3, localLoss: 0, rssi: -55, noise: -92, phy: 866, band: '5 GHz', channel: 36, net: 'box', peak: 0,
    day: { solid: 88, cuts: 'En cours depuis 1 min', worst: 'Maintenant, coupure', since: '3 h 12' } },
  measuring: { lat: null, jit: null, loss: null, localLat: null, localLoss: null, rssi: null, noise: null, phy: null, band: null, channel: null, net: 'office', peak: 0,
    day: { solid: null, cuts: 'Aucune', worst: 'Pas encore de mesure', since: '6 s' } },
  first: { lat: 22, jit: 2, loss: 0, localLat: 1, localLoss: 0, rssi: null, noise: null, phy: null, band: null, channel: null, net: 'office', peak: 0,
    day: { solid: null, cuts: 'Aucune', worst: 'Pas encore assez de mesures', since: '1 min' } },
};
const HISTORY = [
  { id: 'office', solid: 96, unstable: 4, degraded: 0, p90: 14, loss: 0.0 },
  { id: 'box', solid: 81, unstable: 14, degraded: 5, p90: 38, loss: 0.3 },
  { id: 'iphone', solid: 52, unstable: 35, degraded: 13, p90: 118, loss: 1.1 },
];

const settings = { autostart: true, theme: 'system', target: 'default', notify: true, tests: false };
const ui = { view: 'dashboard', popover: true, metric: 'latency', period: '1 h', testing: null, testFailed: false, saved: '', tests: [
  { when: 'Hier, 18:02', profile: 'Complet', down: 451, up: 322, react: 46, mo: 138 },
] };
let series = [];

const $ = id => document.getElementById(id);
const wobble = (v, f) => v === null ? null : Math.max(0, v + (Math.random() - .5) * v * f);
const gradeOf = (m, v) => { const [a, b] = THRESHOLDS[m]; return v < a ? 'solid' : v <= b ? 'unstable' : 'degraded'; };
const isNear = (m, v) => { const [a, b] = THRESHOLDS[m]; const g = gradeOf(m, v); return g === 'solid' ? v >= a * .8 : g === 'unstable' ? v >= b * .8 : false; };
const comma = n => String(n).replace('.', ',');
const fmt = (m, v) => v === null || v === undefined ? '–' : m === 'loss' ? `${comma(v.toFixed(1))} %` : `${Math.round(v)} ms`;
const time = () => new Date().toLocaleTimeString('fr-FR');

function readState() {
  const id = $('scenario').value, s = SCENARIOS[id], net = NETWORKS[s.net];
  const internet = { latency: wobble(s.lat, .12), jitter: wobble(s.jit, .2), loss: s.loss === null ? null : wobble(s.loss, .3) };
  const local = { latency: wobble(s.localLat, .3), loss: s.localLoss };
  let verdict = id === 'offline' ? 'offline' : id === 'measuring' ? 'measuring' : null;
  const grades = {};
  if (!verdict) {
    for (const m in THRESHOLDS) grades[m] = gradeOf(m, internet[m]);
    verdict = Object.values(grades).sort((x, y) => RANK[y] - RANK[x])[0];
  }
  const worst = Object.keys(grades).find(m => grades[m] === verdict);
  const near = verdict === 'solid' ? Object.keys(grades).filter(m => isNear(m, internet[m])) : [];
  const localBad = local.latency !== null && (local.latency > 30 || local.loss > 1);
  let fault = null, cause;
  if (verdict === 'offline') { fault = 'internet'; cause = "La box répond, mais Internet ne répond plus depuis 1 min. Le problème vient de la box ou de l'opérateur."; }
  else if (verdict === 'measuring') cause = 'Nouveau réseau détecté. Premières mesures en cours, 6 sur 10.';
  else if (verdict === 'solid') cause = near.length ? `Bonne connexion pour la visio. ${METRICS[near[0]].name} proche du seuil Instable.` : 'Bonne connexion pour la visio.';
  else if (localBad) { fault = 'local'; cause = `Le Wi-Fi est en cause : signal faible (${s.rssi} dBm). Se rapprocher de la box ou passer en 5 GHz.`; }
  else { fault = 'internet'; cause = `${net.hotspot ? 'Le réseau mobile' : "L'opérateur"} est en cause, le Wi-Fi va bien. ${METRICS[worst].name} à ${fmt(worst, internet[worst])}.`; }
  const permission = $('permission').checked;
  return {
    scenario: id, verdict, grades, near, cause, fault, internet, local, day: s.day,
    network: { ...net, id: s.net, label: permission ? (net.ssid ?? net.name) : (net.ssid ? 'Wi-Fi (nom masqué)' : net.name) },
    wifi: s.rssi === null ? null : { rssi: s.rssi, noise: s.noise, phy: s.phy, band: s.band, channel: s.channel },
    peak: s.peak, firstRun: id === 'first',
  };
}

function shape(state, size = 14) {
  const c = `var(--${state})`, h = size / 2;
  const forms = {
    solid: `<circle cx="${h}" cy="${h}" r="${h - 1}" fill="${c}"/>`,
    unstable: `<circle cx="${h}" cy="${h}" r="${h - 1.5}" fill="none" stroke="${c}" stroke-width="2"/><path d="M${h} 1.5 A${h - 1.5} ${h - 1.5} 0 0 1 ${h} ${size - 1.5} Z" fill="${c}"/>`,
    degraded: `<path d="M${h} 1 L${size - 1} ${size - 1.5} L1 ${size - 1.5} Z" fill="${c}"/>`,
    offline: `<circle cx="${h}" cy="${h}" r="${h - 1.5}" fill="none" stroke="${c}" stroke-width="2"/><path d="M3 ${size - 3} L${size - 3} 3" stroke="${c}" stroke-width="2" stroke-linecap="round"/>`,
    measuring: `<circle cx="${h}" cy="${h}" r="${h - 1.5}" fill="none" stroke="${c}" stroke-width="2" stroke-dasharray="2.4 2.4"/>`,
  };
  return `<svg class="shape ${state === 'measuring' ? 'pulse' : ''}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">${forms[state]}</svg>`;
}

function range(m, v) {
  const { max } = METRICS[m], [a, b] = THRESHOLDS[m];
  const marker = v === null ? '' : `<i style="left:calc(${Math.min(100, v / max * 100)}% - 1.5px)"></i>`;
  return `<div class="range" role="img" aria-label="${METRICS[m].name} : ${fmt(m, v)}. Solide sous ${a} ${METRICS[m].unit}, Dégradée au-delà de ${b} ${METRICS[m].unit}."><span style="width:${a / max * 100}%"></span><span style="width:${(b - a) / max * 100}%"></span><span style="flex:1"></span>${marker}</div>`;
}

function segColor(kind, st) {
  if (st.verdict === 'measuring') return 'var(--line)';
  if (kind === 'local') return st.local.latency === null ? 'var(--line)' : st.fault === 'local' ? `var(--${st.verdict})` : 'var(--solid)';
  return st.fault === 'internet' ? `var(--${st.verdict})` : 'var(--solid)';
}

function path(st, compact) {
  const gw = st.network.hotspot ? 'iPhone' : 'Box';
  const tag = kind => st.fault === kind ? `<b>${st.verdict === 'offline' ? 'coupé' : 'en cause'}</b>` : '';
  const localTxt = st.local.latency === null ? 'en attente' : fmt('latency', st.local.latency);
  const netTxt = st.internet.latency === null ? (st.verdict === 'offline' ? 'aucune réponse' : 'en attente') : fmt('latency', st.internet.latency);
  const cut = st.verdict === 'offline';
  return `<div class="path" role="img" aria-label="Chemin : ce Mac, ${gw}, Internet. ${st.fault ? 'Tronçon ' + (st.fault === 'local' ? 'Wi-Fi' : 'Internet') + (cut ? ' coupé.' : ' en cause.') : 'Aucun tronçon en cause.'}">
    <span class="node">Ce Mac</span><span class="seg ${st.fault === 'local' ? 'fault' : ''}" style="background:${segColor('local', st)}"></span>
    <span class="node">${gw}</span><span class="seg ${st.fault === 'internet' ? 'fault' : ''} ${cut ? 'cut' : ''}" style="${cut ? '' : 'background:' + segColor('internet', st)}"></span>
    <span class="node">Internet</span>
    ${compact ? '' : `<span></span><span class="seg-label">${st.network.kind.startsWith('Wi-Fi') ? 'Wi-Fi' : st.network.kind}, ${localTxt} ${tag('local')}</span><span></span><span class="seg-label">${st.network.hotspot ? 'Réseau mobile' : 'Opérateur'}, ${netTxt} ${tag('internet')}</span><span></span>`}
  </div>`;
}

function testButtons() {
  const busy = k => ui.testing === k;
  const label = (k, idle) => busy(k) ? 'Test en cours…' : idle;
  return `<button class="btn" data-test="quick" ${ui.testing ? 'disabled' : ''} aria-busy="${busy('quick')}">${label('quick', 'Test rapide, 3 s')}</button>
    <button class="btn" data-test="full" ${ui.testing ? 'disabled' : ''} aria-busy="${busy('full')}">${label('full', 'Test complet, 30 s')}</button>`;
}

function renderTray(st) {
  $('tray').innerHTML = shape(st.verdict, 14);
  $('tray').setAttribute('aria-label', `Connexion : ${STATE_WORD[st.verdict]}`);
  $('tray').setAttribute('aria-expanded', String(ui.popover));
}

function renderPopover(st) {
  const el = $('popover');
  el.hidden = !ui.popover;
  const metrics = Object.keys(METRICS).map(m => `<div class="pm">
      <span>${METRICS[m].name} <span class="small">${METRICS[m].short}</span></span><span class="val num">${fmt(m, st.internet[m])}</span>${range(m, st.internet[m])}</div>`).join('');
  const last = ui.tests[0];
  const speed = settings.tests
    ? `<div class="quiet-line" style="margin-bottom:var(--s2)"><span>Débit</span><span class="num">${last ? `↓ ${last.down} · ↑ ${last.up} Mbit/s, ${last.when.toLowerCase()}` : 'Aucun test'}</span></div><div class="test-actions">${testButtons()}</div>`
    : `<div class="quiet-line"><span>Tests de débit désactivés</span><button class="link" data-view="settings">Activer dans Réglages</button></div>`;
  el.innerHTML = `<div class="pop-head">${shape(st.verdict, 16)}<h2>${STATE_WORD[st.verdict]}</h2><span class="where">${st.network.label}</span></div>
    <p class="cause">${st.cause}</p>
    ${path(st, true)}
    <div class="pop-metrics">${metrics}</div>
    <hr class="divider">${speed}
    <button class="btn primary" data-view="dashboard">Ouvrir le tableau de bord</button>`;
}

function overview(st) {
  const d = st.day;
  const facts = [
    ['Aujourd\'hui', d.solid === null ? 'Pas encore assez de mesures' : `Solide ${d.solid} % du temps`],
    ['Coupures aujourd\'hui', d.cuts],
    ['Pire moment', d.worst],
    ['Sur ce réseau depuis', d.since],
  ];
  return `<div class="overview" role="list" aria-label="Vue d'ensemble">${facts.map(([k, v]) => `<div class="fact" role="listitem"><span class="k">${k}</span><span class="v num">${v}</span></div>`).join('')}</div>`;
}

function chart(st) {
  if (st.firstRun) return `<p class="empty">L'historique se remplit au fil des mesures. La première courbe apparaît après une minute.</p>`;
  const m = ui.metric, { max } = METRICS[m], [a, b] = THRESHOLDS[m];
  const W = 820, H = 200, padL = 118, padB = 24;
  const y = v => (H - padB) - Math.min(1, v / max) * (H - padB - 8);
  const x = i => padL + i / Math.max(1, series.length - 1) * (W - padL);
  const pts = series.map((p, i) => p[m] === null ? null : `${x(i).toFixed(1)},${y(p[m]).toFixed(1)}`).filter(Boolean).join(' ');
  const ticks = { '1 h': ['Il y a 1 h', 'Il y a 30 min', 'Maintenant'], '24 h': ['Il y a 24 h', 'Il y a 12 h', 'Maintenant'], '7 j': ['Il y a 7 j', 'Il y a 3 j', "Aujourd'hui"], '30 j': ['Il y a 30 j', 'Il y a 15 j', "Aujourd'hui"] }[ui.period];
  const unit = METRICS[m].unit === '%' ? ' %' : ' ms';
  const thr = (v, label) => `<line x1="${padL}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="4 4"/><text class="axis" x="${padL - 8}" y="${y(v) + 4}" text-anchor="end">${label} ${comma(v)}${unit}</text>`;
  const eventX = x(Math.floor(series.length * .62));
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${METRICS[m].name} sur ${ui.period}, avec les seuils Instable et Dégradée">
      ${thr(a, 'Instable')}${thr(b, 'Dégradée')}
      <line x1="${padL}" x2="${W}" y1="${H - padB}" y2="${H - padB}" stroke="var(--line)"/>
      <line x1="${eventX}" x2="${eventX}" y1="8" y2="${H - padB}" stroke="var(--muted)" stroke-dasharray="2 3"/>
      <text class="axis" x="${eventX + 6}" y="20">Changement de réseau</text>
      <polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/>
      ${ticks.map((t, i) => `<text class="axis" x="${padL + i * (W - padL) / 2}" y="${H - 4}" text-anchor="${['start', 'middle', 'end'][i]}">${t}</text>`).join('')}
    </svg>
    <div class="ribbon" style="max-width:820px;padding-left:${padL / W * 100}%" aria-hidden="true">${series.map(p => `<span style="background:var(--${p.verdict === 'measuring' ? 'line' : p.verdict})"></span>`).join('')}</div>
    <div class="legend"><span>Bande : l'état à chaque instant</span>${['solid', 'unstable', 'degraded', 'offline'].map(s => `<span>${shape(s, 10)}${STATE_WORD[s]}</span>`).join('')}</div></div>`;
}

function networksTable(st) {
  if (st.firstRun) return `<p class="empty">Chaque réseau utilisé apparaîtra ici, avec le temps passé dans chaque état.</p>`;
  const best = HISTORY.reduce((x, y) => y.solid > x.solid ? y : x);
  return `<table><thead><tr><th>Réseau</th><th>Temps par état</th><th class="r">Latence p90</th><th class="r">Perte</th></tr></thead><tbody>
    ${HISTORY.map(h => `<tr><td>${NETWORKS[h.id].name}${h.id === st.network.id ? '<span class="tag">actuel</span>' : ''}<div class="small">${NETWORKS[h.id].kind}${h === best ? ' · <strong>le plus fiable pour la visio</strong>' : ''}</div></td>
      <td><div style="display:flex;align-items:center;gap:10px"><div class="stack" role="img" aria-label="${h.solid} % Solide, ${h.unstable} % Instable, ${h.degraded} % Dégradée">
        <span style="width:${h.solid}%;background:var(--solid)"></span><span style="width:${h.unstable}%;background:var(--unstable)"></span><span style="width:${h.degraded}%;background:var(--degraded)"></span></div>
        <span class="num small" style="color:var(--ink)">${h.solid} % Solide</span></div></td>
      <td class="r num">${h.p90} ms</td><td class="r num">${comma(h.loss.toFixed(1))} %</td></tr>`).join('')}
    </tbody></table>`;
}

function speedSection() {
  if (!settings.tests) return `<div class="quiet-line" style="justify-content:flex-start;gap:var(--s4)"><span>Tests de débit désactivés : aucune donnée n'est consommée.</span><button class="link" data-view="settings">Activer dans Réglages</button></div>`;
  const rows = ui.tests.map(t => `<tr><td>${t.when}</td><td>${t.profile}</td><td class="r num">${t.down} Mbit/s</td><td class="r num">${t.up} Mbit/s</td><td class="r num">${t.react} ms</td><td class="r num">${t.mo} Mo</td></tr>`).join('');
  return `<div class="test-actions" style="margin-bottom:var(--s4)">${testButtons()}</div>
    ${ui.testFailed ? '<p style="margin-bottom:var(--s3)">Test indisponible : le serveur de test ne répond pas. Réessayer dans quelques minutes.</p>' : ''}
    <table><thead><tr><th>Quand</th><th>Test</th><th class="r">Réception</th><th class="r">Envoi</th><th class="r">Latence en charge</th><th class="r">Données</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="small" style="margin-top:var(--s2)">Les tests ne partent que lorsque tu cliques. Rapide : environ 5 Mo. Complet : 50 à 150 Mo.</p>`;
}

function details(st) {
  const w = st.wifi;
  return `<details><summary>Détails techniques</summary><div class="details-grid">
    <div><h3>Connexion</h3><dl><dt>Type</dt><dd>${st.network.kind}</dd><dt>Réseau</dt><dd>${st.network.label}</dd><dt>Accès</dt><dd>${st.network.access}</dd><dt>VPN</dt><dd>${st.network.vpn}</dd><dt>Connexion limitée</dt><dd>${st.network.metered}</dd></dl></div>
    <div><h3>Wi-Fi</h3>${w ? `<dl><dt>Signal</dt><dd class="num">${w.rssi} dBm</dd><dt>Bruit</dt><dd class="num">${w.noise} dBm</dd><dt>Débit du lien</dt><dd class="num">${w.phy} Mbit/s</dd><dt>Bande</dt><dd>${w.band}, canal ${w.channel}</dd></dl>` : '<p class="muted">Pas de Wi-Fi sur cette connexion.</p>'}</div>
    <div><h3>Trafic observé</h3><dl><dt>Pic récent</dt><dd class="num">${st.peak ? st.peak + ' Mbit/s, il y a 12 min' : 'Pas encore de trafic'}</dd><dt>Ligne de la box</dt><dd class="num">${st.network.line}</dd></dl><p class="small" style="margin-top:var(--s2)">Mesuré sans test, à partir de ton propre trafic.</p></div>
  </div></details>`;
}

function renderDashboard(st) {
  const metrics = Object.keys(METRICS).map(m => {
    const [a, b] = THRESHOLDS[m], u = METRICS[m].unit === '%' ? ' %' : ' ms';
    return `<div class="metric">
      <span class="name">${METRICS[m].name}</span><span class="what">${METRICS[m].what}</span>
      <span class="val num" title="${METRICS[m].how}">${fmt(m, st.internet[m])}</span>
      ${range(m, st.internet[m])}
      <span class="small">Solide sous ${comma(a)}${u}, Dégradée au-delà de ${comma(b)}${u}</span>
      <span class="small">${METRICS[m].how}</span>
      ${st.near.includes(m) ? '<span class="small" style="color:var(--ink)">Proche du seuil Instable</span>' : ''}</div>`;
  }).join('');
  const segBtns = (key, opts) => opts.map(([v, l]) => `<button data-${key}="${v}" aria-pressed="${ui[key] === v}">${l}</button>`).join('');
  return `
    <section class="answer" aria-label="État actuel">
      <div class="answer-head">${shape(st.verdict, 24)}<h2>${STATE_WORD[st.verdict]}</h2><span class="net muted">${st.network.label}, ${st.network.kind}<br><span class="num">Mis à jour à ${time()}</span></span></div>
      <p class="cause" style="margin-top:var(--s2)">${st.cause}</p>
      ${path(st, false)}
      ${overview(st)}
    </section>
    <section aria-label="Mesures actuelles"><div class="sec-head"><h2>Mesures actuelles</h2><span class="muted">Vers Internet, une mesure par seconde</span></div><div class="metrics">${metrics}</div></section>
    <section aria-label="Évolution">
      <div class="sec-head"><h2>Évolution</h2><div class="controls">
        <div class="seg-ctl" role="group" aria-label="Mesure affichée">${segBtns('metric', [['latency', 'Latence'], ['jitter', 'Gigue'], ['loss', 'Perte']])}</div>
        <div class="seg-ctl" role="group" aria-label="Période">${segBtns('period', [['1 h', '1 h'], ['24 h', '24 h'], ['7 j', '7 j'], ['30 j', '30 j']])}</div></div></div>
      ${chart(st)}
    </section>
    <section aria-label="Tes réseaux"><div class="sec-head"><h2>Tes réseaux</h2><span class="muted">30 derniers jours</span></div>${networksTable(st)}</section>
    <section aria-label="Débit"><div class="sec-head"><h2>Débit</h2></div>${speedSection()}</section>
    <section>${details(st)}</section>
    <p class="foot">${settings.tests ? 'Tests de débit activés : ils passent par Cloudflare, uniquement quand tu cliques.' : 'Mode local : seuls de petits pings quittent cet ordinateur.'}</p>`;
}

function renderSettings() {
  const radio = (v, l) => `<label><input type="radio" name="theme" value="${v}" ${settings.theme === v ? 'checked' : ''}> ${l}</label>`;
  return `<div class="settings"><h2>Réglages</h2>
    <div class="group"><h3>Général</h3><div class="rows">
      <div class="setting"><label for="s-autostart">Lancer à l'ouverture de session</label><input id="s-autostart" type="checkbox" role="switch" ${settings.autostart ? 'checked' : ''}><span class="hint">L'état reste visible dans la barre des menus.</span></div>
      <div class="setting"><span id="theme-label" style="font-weight:500">Apparence</span><div class="radios" role="radiogroup" aria-labelledby="theme-label">${radio('system', 'Système')}${radio('light', 'Clair')}${radio('dark', 'Sombre')}</div><span class="hint">Système suit le réglage clair ou sombre de macOS.</span></div>
    </div></div>
    <div class="group"><h3>Mesure</h3><div class="rows">
      <div class="setting"><label for="s-target">Serveurs de mesure</label><select id="s-target"><option value="default" ${settings.target === 'default' ? 'selected' : ''}>Cloudflare et Google (recommandé)</option><option value="custom" ${settings.target === 'custom' ? 'selected' : ''}>Serveur personnalisé</option></select>
        <span class="hint">Une petite requête par seconde pour mesurer latence, gigue et perte.</span></div>
      ${settings.target === 'custom' ? `<div class="setting"><label for="s-host">Adresse du serveur</label><input id="s-host" type="text" placeholder="ex. 192.168.1.10" aria-describedby="s-host-hint"><span class="hint" id="s-host-hint">Une adresse IP ou un nom de domaine qui répond au ping.</span></div>` : ''}
    </div></div>
    <div class="group"><h3>Notifications</h3><div class="rows">
      <div class="setting"><label for="s-notify">Prévenir quand la connexion se dégrade</label><input id="s-notify" type="checkbox" role="switch" ${settings.notify ? 'checked' : ''}><span class="hint">Seulement si la dégradation dure plus de 10 secondes.</span></div>
    </div></div>
    <div class="group"><h3>Tests de débit</h3><div class="rows">
      <div class="setting"><label for="s-tests">Autoriser les tests de débit</label><input id="s-tests" type="checkbox" role="switch" ${settings.tests ? 'checked' : ''}>
        <span class="hint">Désactivé par défaut. Les tests passent par Cloudflare (gratuit, sans compte) et ne partent jamais seuls : uniquement quand tu cliques sur Test rapide ou Test complet.</span></div>
    </div></div>
    <p class="saved" role="status">${ui.saved}</p>
  </div>`;
}

function snapshot(st) { return { verdict: st.verdict, latency: st.internet.latency, jitter: st.internet.jitter, loss: st.internet.loss }; }

function focusKey() {
  const a = document.activeElement;
  if (!a || a === document.body) return null;
  if (a.tagName === 'SUMMARY') return '#content summary';
  if (a.id) return '#' + a.id;
  if (a.name === 'theme') return `input[name="theme"][value="${a.value}"]`;
  const d = Object.entries(a.dataset || {})[0];
  return d ? `${a.closest('#popover') ? '#popover ' : a.closest('nav') ? 'nav ' : '#content '}[data-${d[0]}="${d[1]}"]` : null;
}

function render() {
  const key = focusKey();
  const st = readState();
  series.push(snapshot(st)); if (series.length > 120) series.shift();
  renderTray(st); renderPopover(st);
  document.querySelectorAll('nav [data-view]').forEach(b => b.setAttribute('aria-current', b.dataset.view === ui.view ? 'page' : 'false'));
  // The settings form is only rebuilt on change, so typing and focus are never interrupted.
  if (ui.view === 'dashboard') {
    const open = document.querySelector('#content details')?.open;
    $('content').innerHTML = renderDashboard(st);
    if (open) document.querySelector('#content details').open = true;
  } else if (!document.querySelector('#content .settings')) {
    $('content').innerHTML = renderSettings();
  }
  // Re-rendering replaces nodes every second; put keyboard focus back where it was.
  if (key) document.querySelector(key)?.focus();
  $('clock').textContent = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

function applyTheme() {
  if (settings.theme === 'system') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = settings.theme;
}
function confirmSaved(text) { ui.saved = text; const s = document.querySelector('.saved'); if (s) s.textContent = text; }

function reset() { series = []; for (let i = 0; i < 90; i++) series.push(snapshot(readState())); render(); }

['scenario', 'permission'].forEach(id => $(id).addEventListener('change', reset));
$('tray').addEventListener('click', () => { ui.popover = !ui.popover; render(); });

document.addEventListener('click', e => {
  const b = e.target.closest('[data-metric],[data-period],[data-test],[data-view]');
  if (!b) return;
  if (b.dataset.view) { ui.view = b.dataset.view; $('content').innerHTML = ''; ui.saved = ''; }
  if (b.dataset.metric) ui.metric = b.dataset.metric;
  if (b.dataset.period) ui.period = b.dataset.period;
  if (b.dataset.test && !ui.testing) {
    const kind = b.dataset.test;
    ui.testing = kind; ui.testFailed = false;
    setTimeout(() => {
      ui.testing = null;
      ui.testFailed = Math.random() < .2;
      if (!ui.testFailed) ui.tests.unshift(kind === 'quick'
        ? { when: `Aujourd'hui, ${time().slice(0, 5)}`, profile: 'Rapide', down: 380 + Math.round(Math.random() * 60), up: 280 + Math.round(Math.random() * 40), react: 30, mo: 4 }
        : { when: `Aujourd'hui, ${time().slice(0, 5)}`, profile: 'Complet', down: 430 + Math.round(Math.random() * 40), up: 300 + Math.round(Math.random() * 30), react: 44, mo: 121 });
      render();
    }, kind === 'quick' ? 3000 : 6000);
  }
  render();
});

document.addEventListener('change', e => {
  const t = e.target;
  if (!t.closest('#content .settings')) return;
  if (t.id === 's-autostart') settings.autostart = t.checked;
  if (t.id === 's-notify') settings.notify = t.checked;
  if (t.id === 's-tests') settings.tests = t.checked;
  if (t.name === 'theme') { settings.theme = t.value; applyTheme(); }
  if (t.id === 's-target') { settings.target = t.value; $('content').innerHTML = renderSettings(); $('s-target').focus(); }
  confirmSaved(`Enregistré à ${time()}.`);
  renderPopover(readState());
});

applyTheme();
reset();
setInterval(render, 1000);
</script>
</body>
</html>
