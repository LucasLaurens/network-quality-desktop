[package]
name = "infrastructure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
application.workspace = true
domain.workspace = true
ping-async.workspace = true
netdev.workspace = true
netwatcher.workspace = true
tokio = { workspace = true, features = ["net", "rt"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
dispatch2.workspace = true
objc2.workspace = true
objc2-core-wlan.workspace = true
objc2-core-location.workspace = true
objc2-foundation.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Foundation",
    "Networking_Connectivity",
    "Win32_Foundation",
    "Win32_NetworkManagement_WiFi",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "macros", "rt"] }

[lints]
workspace = true
